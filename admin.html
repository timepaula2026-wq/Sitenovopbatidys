<title>Admin · Paula Batista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root {
  --bg:    #F7F4EF;
  --bg2:   #EDEAE3;
  --card:  #FFFFFF;
  --fg:    #1A140D;
  --fg2:   #5C4A32;
  --ouro:  #B8873F;
  --ouro-l:#D4A665;
  --verde: #2E7D32;
  --azul:  #1565C0;
  --laranja:#E65100;
  --roxo:  #6A1B9A;
  --cinza: #757575;
  --linha: rgba(26,20,13,.10);
  --r:     10px;
  --r-lg:  16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:    #0F0D09;
    --bg2:   #1A1610;
    --card:  #211C14;
    --fg:    #F0E8D8;
    --fg2:   #C4A882;
    --ouro:  #C9A64A;
    --ouro-l:#E8C877;
    --verde: #66BB6A;
    --azul:  #64B5F6;
    --laranja:#FFB74D;
    --roxo:  #CE93D8;
    --cinza: #9E9E9E;
    --linha: rgba(240,232,216,.09);
    --card:  #1E1810;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:    #0F0D09; --bg2: #1A1610; --card: #1E1810;
  --fg:    #F0E8D8; --fg2: #C4A882; --ouro: #C9A64A; --ouro-l: #E8C877;
  --verde: #66BB6A; --azul: #64B5F6; --laranja: #FFB74D; --roxo: #CE93D8;
  --cinza: #9E9E9E; --linha: rgba(240,232,216,.09); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Archivo', sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) 20px max(24px, env(safe-area-inset-bottom, 0px));
}
.login-card {
  background: var(--card);
  border: 1px solid var(--linha);
  border-radius: var(--r-lg);
  padding: 44px 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 8px 48px rgba(0,0,0,.12);
}
.login-logo {
  font-size: 1rem;
  font-weight: 700;
  color: var(--ouro);
  letter-spacing: .04em;
  margin-bottom: 6px;
}
.login-logo span { color: var(--fg); font-weight: 400; }
.login-card h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 28px; }
.fi {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 16px;
}
.fi label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.fi input {
  background: var(--bg);
  border: 1.5px solid var(--linha);
  border-radius: var(--r);
  padding: 10px 14px;
  font-family: 'Archivo', sans-serif;
  font-size: .9rem;
  color: var(--fg);
  outline: none;
  transition: border-color .2s;
}
.fi input:focus { border-color: var(--ouro); }
.login-btn {
  width: 100%;
  background: var(--ouro);
  color: #fff;
  border: none;
  border-radius: var(--r);
  padding: 12px;
  font-family: 'Archivo', sans-serif;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: background .2s;
}
.login-btn:hover { background: var(--ouro-l); }
.login-btn:disabled { opacity: .6; cursor: not-allowed; }
.login-err {
  color: #c62828;
  font-size: .8rem;
  margin-top: 10px;
  text-align: center;
  min-height: 18px;
}

/* ── APP ── */
#app-screen { display: none; }
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--linha);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 max(20px, env(safe-area-inset-left, 0px));
  height: 56px;
}
.topbar-brand { font-weight: 700; font-size: .9rem; }
.topbar-brand em { color: var(--ouro); font-style: normal; }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.topbar-user { font-size: .78rem; color: var(--fg2); }
.logout-btn {
  background: transparent;
  border: 1.5px solid var(--linha);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: 'Archivo', sans-serif;
  font-size: .75rem;
  font-weight: 600;
  color: var(--fg2);
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.logout-btn:hover { border-color: var(--ouro); color: var(--ouro); }

.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px max(20px, env(safe-area-inset-left, 0px));
}
.page-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 24px; }

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}
@media (max-width: 720px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 400px) { .stats-row { grid-template-columns: 1fr; } }
.stat-card {
  background: var(--card);
  border: 1px solid var(--linha);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--fg2); }
.stat-val { font-size: 1.8rem; font-weight: 700; line-height: 1; }
.stat-sub { font-size: .75rem; color: var(--fg2); margin-top: 2px; }

/* Filtros */
.filtros {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.filtro-btn {
  background: var(--card);
  border: 1.5px solid var(--linha);
  border-radius: 50px;
  padding: 6px 16px;
  font-family: 'Archivo', sans-serif;
  font-size: .78rem;
  font-weight: 600;
  color: var(--fg2);
  cursor: pointer;
  transition: all .2s;
}
.filtro-btn.ativo { background: var(--ouro); border-color: var(--ouro); color: #fff; }
.search-wrap { margin-left: auto; }
.search-wrap input {
  background: var(--card);
  border: 1.5px solid var(--linha);
  border-radius: 8px;
  padding: 7px 14px;
  font-family: 'Archivo', sans-serif;
  font-size: .85rem;
  color: var(--fg);
  outline: none;
  width: 220px;
  transition: border-color .2s;
}
.search-wrap input:focus { border-color: var(--ouro); }

/* Tabela */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--linha);
  border-radius: var(--r-lg);
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead { background: var(--bg2); }
th {
  text-align: left;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--fg2);
  padding: 12px 16px;
  white-space: nowrap;
}
td {
  padding: 13px 16px;
  border-top: 1px solid var(--linha);
  font-size: .85rem;
  vertical-align: middle;
}
tr:hover td { background: var(--bg2); }
.td-nome { font-weight: 600; }
.td-email, .td-tel { color: var(--fg2); font-size: .8rem; }
.empty-row td { text-align: center; padding: 48px 16px; color: var(--fg2); }

/* Badges de tipo */
.badge-tipo {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 50px;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  white-space: nowrap;
}
.badge-consorcio   { background: rgba(184,135,63,.15); color: var(--ouro); }
.badge-mentoria    { background: rgba(21,101,192,.12); color: var(--azul); }
.badge-palestra    { background: rgba(106,27,154,.12); color: var(--roxo); }
.badge-lista_espera{ background: rgba(230,81,0,.12);   color: var(--laranja); }

/* Status select */
.status-sel {
  background: transparent;
  border: 1.5px solid var(--linha);
  border-radius: 6px;
  padding: 4px 8px;
  font-family: 'Archivo', sans-serif;
  font-size: .78rem;
  font-weight: 600;
  color: var(--fg);
  cursor: pointer;
  outline: none;
}
.status-novo        { border-color: var(--cinza); color: var(--cinza); }
.status-em_contato  { border-color: var(--azul);  color: var(--azul); }
.status-convertido  { border-color: var(--verde);  color: var(--verde); }
.status-descartado  { border-color: #c62828; color: #c62828; }

/* Paginação */
.pag-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-top: 1px solid var(--linha);
  font-size: .8rem;
  color: var(--fg2);
}
.pag-btns { display: flex; gap: 6px; }
.pag-btn {
  background: var(--bg2);
  border: 1px solid var(--linha);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--fg);
  transition: background .15s;
}
.pag-btn:disabled { opacity: .4; cursor: not-allowed; }
.pag-btn:not(:disabled):hover { background: var(--ouro); color: #fff; border-color: var(--ouro); }

/* Loader */
.loader {
  text-align: center;
  padding: 48px 16px;
  color: var(--fg2);
  font-size: .85rem;
}
.spinner {
  display: inline-block;
  width: 22px; height: 22px;
  border: 3px solid var(--linha);
  border-top-color: var(--ouro);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin-right: 10px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Paula <span>Batista</span> · <em>Admin</em></div>
    <h1>Entrar no painel</h1>
    <div class="fi">
      <label>E-mail</label>
      <input type="email" id="l-email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="fi">
      <label>Senha</label>
      <input type="password" id="l-senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="l-btn">Entrar</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="topbar">
    <div class="topbar-brand">Paula <em>Batista</em> · Admin</div>
    <div class="topbar-right">
      <span class="topbar-user" id="user-email-label"></span>
      <button class="logout-btn" id="logout-btn">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="page-title">CRM · Leads</div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total</div>
        <div class="stat-val" id="st-total">—</div>
        <div class="stat-sub">todos os leads</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Consórcio</div>
        <div class="stat-val" id="st-consorcio">—</div>
        <div class="stat-sub">simulações</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Mentoria / Palestra</div>
        <div class="stat-val" id="st-mp">—</div>
        <div class="stat-sub">pedidos</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Lista de Espera</div>
        <div class="stat-val" id="st-le">—</div>
        <div class="stat-sub">curso</div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filtros">
      <button class="filtro-btn ativo" data-tipo="">Todos</button>
      <button class="filtro-btn" data-tipo="consorcio">Consórcio</button>
      <button class="filtro-btn" data-tipo="mentoria">Mentoria</button>
      <button class="filtro-btn" data-tipo="palestra">Palestra</button>
      <button class="filtro-btn" data-tipo="lista_espera">Lista de Espera</button>
      <div class="search-wrap">
        <input type="search" id="busca" placeholder="Buscar nome, e-mail…">
      </div>
    </div>

    <!-- Tabela -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Contato</th>
            <th>Detalhes</th>
            <th>Status</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pag-row">
        <span id="pag-info"></span>
        <div class="pag-btns">
          <button class="pag-btn" id="pag-prev">← Anterior</button>
          <button class="pag-btn" id="pag-next">Próximo →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.3/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://fhfphlqrgtabkiqoywea.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoZnBobHFyZ3RhYmtpcW95d2VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjI3MDg3MTYsImV4cCI6MjAzODI4NDcxNn0.hXFcDhFg-tpD-fNgZ1P6jFi2lWHMB4D1h8hGKGLGBRI';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const PAGE_SIZE = 20;
let state = { tipo: '', busca: '', pagina: 0, total: 0 };

// ── Auth ──
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showApp(session.user.email);

  sb.auth.onAuthStateChange((_e, session) => {
    if (session) showApp(session.user.email);
    else showLogin();
  });
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
}
function showApp(email) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-email-label').textContent = email;
  loadStats();
  loadLeads();
}

document.getElementById('l-btn').addEventListener('click', async () => {
  const email = document.getElementById('l-email').value.trim();
  const senha = document.getElementById('l-senha').value;
  const btn = document.getElementById('l-btn');
  const err = document.getElementById('l-err');
  err.textContent = '';
  btn.textContent = 'Entrando…';
  btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) {
    err.textContent = 'E-mail ou senha incorretos.';
    btn.textContent = 'Entrar';
    btn.disabled = false;
  }
});
document.getElementById('l-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('l-btn').click();
});
document.getElementById('logout-btn').addEventListener('click', () => sb.auth.signOut());

// ── Stats ──
async function loadStats() {
  const { data } = await sb.from('pb_leads').select('tipo');
  if (!data) return;
  document.getElementById('st-total').textContent = data.length;
  document.getElementById('st-consorcio').textContent = data.filter(r => r.tipo === 'consorcio').length;
  document.getElementById('st-mp').textContent = data.filter(r => r.tipo === 'mentoria' || r.tipo === 'palestra').length;
  document.getElementById('st-le').textContent = data.filter(r => r.tipo === 'lista_espera').length;
}

// ── Leads ──
async function loadLeads() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = `<tr><td colspan="6"><div class="loader"><span class="spinner"></span>Carregando…</div></td></tr>`;

  let q = sb.from('pb_leads')
    .select('*', { count: 'exact' })
    .order('created_at', { ascending: false })
    .range(state.pagina * PAGE_SIZE, (state.pagina + 1) * PAGE_SIZE - 1);

  if (state.tipo) q = q.eq('tipo', state.tipo);
  if (state.busca) q = q.or(`nome.ilike.%${state.busca}%,email.ilike.%${state.busca}%,telefone.ilike.%${state.busca}%`);

  const { data, count, error } = await q;
  if (error) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Erro ao carregar leads.</td></tr>`;
    return;
  }
  state.total = count || 0;
  renderTable(data || []);
  renderPag();
}

const TIPO_LABELS = {
  consorcio: 'Consórcio',
  mentoria: 'Mentoria',
  palestra: 'Palestra',
  lista_espera: 'Lista de Espera'
};

function renderTable(rows) {
  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">Nenhum lead encontrado.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const campos = r.campos || {};
    const detalhes = Object.entries(campos)
      .filter(([k]) => k !== 'origem')
      .map(([k, v]) => `<span style="color:var(--fg2)">${k.replace(/_/g,' ')}:</span> ${v}`)
      .join(' · ') || '—';
    const data = new Date(r.created_at).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
    return `
    <tr>
      <td class="td-nome">${esc(r.nome)}</td>
      <td><span class="badge-tipo badge-${r.tipo}">${TIPO_LABELS[r.tipo] || r.tipo}</span></td>
      <td>
        ${r.telefone ? `<div class="td-tel">📱 ${esc(r.telefone)}</div>` : ''}
        ${r.email    ? `<div class="td-email">✉ ${esc(r.email)}</div>` : ''}
      </td>
      <td style="font-size:.78rem;max-width:260px;white-space:normal">${detalhes}</td>
      <td>
        <select class="status-sel status-${r.status}" data-id="${r.id}" onchange="updateStatus(this)">
          <option value="novo"       ${r.status==='novo'       ?'selected':''}>Novo</option>
          <option value="em_contato" ${r.status==='em_contato' ?'selected':''}>Em contato</option>
          <option value="convertido" ${r.status==='convertido' ?'selected':''}>Convertido</option>
          <option value="descartado" ${r.status==='descartado' ?'selected':''}>Descartado</option>
        </select>
      </td>
      <td style="white-space:nowrap;color:var(--fg2)">${data}</td>
    </tr>`;
  }).join('');
}

function renderPag() {
  const total = state.total;
  const pag = state.pagina;
  const pages = Math.ceil(total / PAGE_SIZE);
  document.getElementById('pag-info').textContent = `${total} leads · página ${pag + 1} de ${pages || 1}`;
  document.getElementById('pag-prev').disabled = pag === 0;
  document.getElementById('pag-next').disabled = pag >= pages - 1;
}

document.getElementById('pag-prev').addEventListener('click', () => { state.pagina--; loadLeads(); });
document.getElementById('pag-next').addEventListener('click', () => { state.pagina++; loadLeads(); });

// Filtros
document.querySelectorAll('.filtro-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');
    state.tipo = btn.dataset.tipo;
    state.pagina = 0;
    loadLeads();
  });
});

// Busca
let buscaTimer;
document.getElementById('busca').addEventListener('input', e => {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(() => {
    state.busca = e.target.value.trim();
    state.pagina = 0;
    loadLeads();
  }, 400);
});

// Update status
async function updateStatus(sel) {
  const id = sel.dataset.id;
  const status = sel.value;
  sel.className = `status-sel status-${status}`;
  await sb.from('pb_leads').update({ status }).eq('id', id);
  loadStats();
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

initAuth();
</script>
